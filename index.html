<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Non-Custodial Wallet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        :root {
            --bg: #05070d;
            --bg-2: #0b0f1c;
            --glass: rgba(255,255,255,0.055);
            --glass-strong: rgba(255,255,255,0.09);
            --border: rgba(255,255,255,0.09);
            --accent: #0098ea;
            --accent-2: #34c9ff;
            --text: #eef3fb;
            --text-dim: #8b96ab;
            --success: #22c55e;
            --danger: #f87171;
            --warn: #fbbf24;
        }
        html, body { height: 100%; }
        body {
            background:
                radial-gradient(720px 480px at 12% -8%, rgba(0,152,234,0.22), transparent 60%),
                radial-gradient(620px 460px at 100% 10%, rgba(52,201,255,0.14), transparent 55%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 96px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            overflow-x: hidden;
        }
        body::before, body::after { content: none; }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(28px) saturate(140%);
            -webkit-backdrop-filter: blur(28px) saturate(140%);
            border: 1px solid var(--border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            pointer-events: none;
        }
        .glass-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 13px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        .glass-input::placeholder { color: rgba(238,243,251,0.3); }
        .glass-input:focus {
            border-color: var(--accent);
            background: rgba(0,152,234,0.08);
            box-shadow: 0 0 0 4px rgba(0,152,234,0.15);
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #04141f;
            border: none;
            padding: 15px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0,152,234,0.28);
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; }
        .btn-secondary {
            width: 100%;
            background: rgba(255,255,255,0.06);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 15px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .btn-danger {
            width: 100%;
            background: rgba(248,113,113,0.1);
            color: var(--danger);
            border: 1px solid rgba(248,113,113,0.3);
            padding: 13px;
            border-radius: 16px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-3 { gap: 12px; }
        .text-center { text-align: center; }
        .text-xs { font-size: 12px; color: var(--text-dim); }
        .text-sm { font-size: 14px; }
        .font-bold { font-weight: 700; }

        .grid-24 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            direction: ltr;
            background: rgba(255,255,255,0.04);
            padding: 8px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .word-chip {
            background: rgba(255,255,255,0.06);
            padding: 5px;
            border-radius: 6px;
            font-size: 11px;
            text-align: center;
            font-family: monospace;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
        }
        .word-chip span { color: #64748b; font-size: 9px; }
        .warn-box {
            background: rgba(251,191,36,0.1);
            border: 1px solid rgba(251,191,36,0.3);
            color: var(--warn);
            border-radius: 14px;
            padding: 11px;
            font-size: 11px;
            line-height: 1.6;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* هدر */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 4px 4px 0;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .status-badge {
            font-size: 10px;
            background: rgba(34,197,94,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--success);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(34,197,94,0.25);
            font-weight: 600;
        }

        /* داشبورد */
        .balance-card { text-align: center; padding: 30px 20px; }
        .addr-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-family: monospace;
            background: rgba(255,255,255,0.06);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-dim);
            direction: ltr;
            margin-bottom: 18px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .balance-num {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1.2px;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff, var(--accent-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .action-row { display: flex; gap: 10px; direction: ltr; }
        .action-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 14px 6px;
            cursor: pointer;
            color: var(--text);
        }
        .action-btn .icon-circle {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,152,234,0.15);
            color: var(--accent-2);
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            font-weight: 700;
        }
        .action-btn span { font-size: 11px; font-weight: 600; }

        .list-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            cursor: pointer;
        }
        .list-card .left { display: flex; align-items: center; gap: 12px; }
        .list-card .emoji-icon { font-size: 20px; }

        /* تاریخچه تراکنش‌ها */
        .tx-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 13px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            cursor: pointer;
        }
        .tx-row:last-child { border-bottom: none; }
        .tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .tx-icon {
            flex-shrink: 0;
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 700;
        }
        .tx-icon.in { background: rgba(34,197,94,0.14); color: var(--success); }
        .tx-icon.out { background: rgba(248,113,113,0.14); color: var(--danger); }
        .tx-meta { display: flex; flex-direction: column; min-width: 0; text-align: right; }
        .tx-addr { font-size: 11px; color: var(--text-dim); font-family: monospace; direction: ltr; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .tx-date { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
        .tx-amount { font-size: 13px; font-weight: 700; white-space: nowrap; direction: ltr; }
        .tx-amount.in { color: var(--success); }
        .tx-amount.out { color: var(--text); }

        /* ناوبری پایین */
        .bottom-nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 448px;
            background: rgba(10,14,24,0.7);
            backdrop-filter: blur(34px) saturate(160%);
            -webkit-backdrop-filter: blur(34px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
            box-shadow: 0 14px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
            direction: ltr;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .nav-item.active { color: var(--accent-2); background: rgba(0,152,234,0.14); }
        .nav-item .nav-icon { font-size: 17px; }

        /* ---------- صفحه‌ی رمز ۴ رقمی (Passcode) ---------- */
        .pin-overlay {
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 1000;
            background: rgba(5,7,13,0.88);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            direction: ltr;
            overflow-y: auto;
        }
        .pin-inner {
            width: 100%;
            max-width: 480px;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 9vh 16px 3vh;
        }
        .pin-top { display: flex; flex-direction: column; align-items: center; }
        .pin-icon { font-size: 44px; line-height: 1; margin-bottom: 26px; }
        .pin-title {
            font-size: 21px;
            font-weight: 500;
            color: var(--text);
            text-align: center;
            margin-bottom: 26px;
            line-height: 1.5;
        }
        .pin-dots { display: flex; gap: 24px; height: 14px; align-items: center; }
        .pin-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 1.5px solid var(--text);
            background: transparent;
            transition: background 0.12s;
        }
        .pin-dot.filled { background: var(--accent-2); border-color: var(--accent-2); }
        .pin-error { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 12px; text-align: center; }
        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 20px 22px;
            margin-top: 8px;
        }
        .pin-key {
            width: min(20vw, 84px);
            height: min(20vw, 84px);
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }
        .pin-key:active { background: rgba(255,255,255,0.14); }
        .pin-key b { font-size: 30px; font-weight: 400; line-height: 1; }
        .pin-key small { font-size: 11px; letter-spacing: 3px; color: var(--text-dim); margin-top: 4px; height: 12px; line-height: 12px; }
        .pin-key svg { width: 36px; height: 36px; }
        .pin-key-empty { width: min(20vw, 84px); height: min(20vw, 84px); visibility: hidden; }
        .pin-link {
            background: none;
            border: none;
            color: var(--accent-2);
            font-size: 19px;
            cursor: pointer;
            padding: 12px;
            margin-top: 18px;
        }
        .pin-shake { animation: pin-shake 0.4s; }
        @keyframes pin-shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
        }

        /* ---------- پنجره‌ی شیشه‌ای وضعیت ارسال/اتصال ---------- */
        .sending-overlay {
            position: fixed;
            inset: 0;
            z-index: 1200;
            background: rgba(5,7,13,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .sending-card {
            background: rgba(15,20,32,0.9);
            backdrop-filter: blur(34px) saturate(160%);
            -webkit-backdrop-filter: blur(34px) saturate(160%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 34px 26px;
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 25px 55px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
            text-align: center;
        }
        .sending-spinner {
            width: 46px; height: 46px;
            border-radius: 50%;
            border: 3px solid rgba(0,152,234,0.15);
            border-top-color: var(--accent);
            animation: sending-spin 0.8s linear infinite;
        }
        @keyframes sending-spin { to { transform: rotate(360deg); } }
        .sending-icon { font-size: 44px; }
        .sending-text { font-size: 14px; font-weight: 600; color: var(--text); white-space: pre-line; line-height: 1.6; }
    </style>
</head>
<body>

        <div class="brand">
            <div class="brand-icon">💎</div>
            <div>
                <span class="text-sm font-bold" style="display:block; line-height:1.2;">شیشه ولت</span>
                <span style="font-size:9px; color:var(--text-dim); font-weight:600;">نسخه v2.1 (Wallet V5 + TonConnect)</span>
            </div>
        </div>
        <div id="connection-status" class="status-badge">آماده</div>
    </div>
